<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<base href="./">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم قصر عابدين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Tajawal:wght@400;500;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a227;
    --gold-light: #e6c352;
    --gold-dark: #8a6d14;
    --black: #0a0a0a;
    --black-soft: #121212;
    --black-card: #1a1a1a;
    --black-line: #2a2a2a;
    --cream: #f5ecd7;
    --muted: #a89a7e;
    --danger: #c0392b;
    --success: #27AE60;
    --info: #3498db;
    --warning: #e67e22;
    --shadow: rgba(0, 0, 0, 0.4);
    --shadow-strong: rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Tajawal', 'Cairo', sans-serif;
    background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
    background-attachment: fixed;
    min-height: 100vh;
    color: var(--cream);
    padding: 12px;
    font-size: 16px;
  }

  /* ============ Login ============ */
  .login-wrap {
    max-width: 460px;
    margin: 6vh auto;
    background: var(--black-soft);
    border: 3px solid var(--gold);
    border-radius: 24px;
    padding: 34px 26px;
    text-align: center;
    box-shadow: 0 20px 60px var(--shadow-strong), 0 0 40px rgba(201, 162, 39, 0.2);
  }

  .login-wrap .crown {
    font-size: 3rem;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 12px rgba(201, 162, 39, 0.6));
  }

  .login-wrap h1 {
    font-family: 'Amiri', 'Cairo', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 6px;
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(201, 162, 39, 0.4);
  }

  .login-wrap .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 26px;
    font-weight: 700;
  }

  .login-wrap .pw-wrap { position: relative; margin-bottom: 14px; }

  .login-wrap input {
    width: 100%;
    padding: 16px 16px 16px 52px;
    border: 2px solid var(--black-line);
    border-radius: 14px;
    font-family: inherit;
    font-size: 1rem;
    background: var(--black);
    color: var(--cream);
    transition: border-color 0.2s;
  }

  .login-wrap input:focus {
    outline: none;
    border-color: var(--gold);
  }

  .login-wrap input::placeholder { color: #666; }

  .toggle-pw {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    font-size: 1.3rem;
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    color: var(--gold);
  }

  .toggle-pw:hover { background: rgba(201, 162, 39, 0.15); }

  #loginErr {
    color: var(--danger);
    font-size: 0.9rem;
    margin-top: 12px;
    min-height: 22px;
    font-weight: 700;
  }

  .login-hint {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 20px;
    line-height: 1.6;
  }

  /* ============ Buttons ============ */
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    padding: 13px 22px;
    font-weight: 900;
    font-size: 1rem;
    transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
  }

  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

  .btn-primary {
    background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    color: var(--black);
    box-shadow: 0 6px 20px rgba(201, 162, 39, 0.35);
    font-size: 1.05rem;
  }

  .btn-primary:hover:not(:disabled) {
    box-shadow: 0 10px 28px rgba(201, 162, 39, 0.5);
    transform: translateY(-2px);
  }

  .btn-secondary {
    background: var(--black-card);
    color: var(--gold);
    border: 2px solid var(--black-line);
  }

  .btn-secondary:hover { border-color: var(--gold); background: var(--black-soft); }

  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 2px solid var(--danger);
    padding: 8px 14px;
    font-size: 0.85rem;
  }

  .btn-danger:hover { background: var(--danger); color: #fff; }

  .btn-info {
    background: transparent;
    color: var(--info);
    border: 2px solid var(--info);
    padding: 8px 14px;
    font-size: 0.85rem;
  }

  .btn-info:hover { background: var(--info); color: #fff; }

  .btn-add {
    background: transparent;
    color: var(--gold);
    border: 3px dashed var(--gold);
    width: 100%;
    padding: 16px;
    font-size: 1rem;
    margin-top: 12px;
    border-radius: 14px;
  }

  .btn-add:hover { background: rgba(201, 162, 39, 0.08); }

  /* ============ Dashboard ============ */
  #dashboard { max-width: 1000px; margin: 0 auto; display: none; }
  #dashboard.active { display: block; }

  /* ============ Header ============ */
  .admin-header {
    background: var(--black-soft);
    border: 3px solid var(--gold);
    border-radius: 20px;
    padding: 18px 22px;
    margin-bottom: 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: 0 10px 30px var(--shadow), 0 0 30px rgba(201, 162, 39, 0.15);
    position: sticky;
    top: 12px;
    z-index: 50;
  }

  .admin-header h1 {
    font-family: 'Amiri', 'Cairo', serif;
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 1px;
    margin: 0;
  }

  .admin-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ============ Cards ============ */
  .card {
    background: var(--black-soft);
    border: 2px solid var(--black-line);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 6px 20px var(--shadow);
  }

  .card-title {
    font-family: 'Amiri', 'Cairo', serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--black-line);
  }

  .card-title .title-info {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    cursor: pointer;
  }

  .card-title .zone-icon { font-size: 1.5rem; }

  .card-title .toggle-chev {
    font-size: 1rem;
    transition: transform 0.2s;
    color: var(--muted);
  }

  .card-title .toggle-chev.open { transform: rotate(180deg); }

  .type-badge {
    font-size: 0.75rem;
    background: var(--black-card);
    color: var(--gold-light);
    border: 1px solid var(--black-line);
    border-radius: 8px;
    padding: 4px 10px;
    font-weight: 900;
  }

  .type-badge.weight { color: var(--warning); border-color: var(--warning); }
  .type-badge.count { color: var(--info); border-color: var(--info); }

  .zone-body { display: none; }
  .zone-body.open { display: block; }

  /* ============ Form Fields ============ */
  label {
    display: block;
    font-size: 0.88rem;
    color: var(--gold-light);
    margin-bottom: 6px;
    margin-top: 14px;
    font-weight: 800;
  }

  input[type=text],
  input[type=number],
  input[type=tel],
  textarea,
  select {
    width: 100%;
    background: var(--black);
    border: 2px solid var(--black-line);
    color: var(--cream);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    transition: border-color 0.2s;
  }

  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--gold);
  }

  textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

  select { cursor: pointer; }

  /* ============ Product Box ============ */
  .item-box {
    background: var(--black-card);
    border: 2px solid var(--black-line);
    border-radius: 14px;
    padding: 16px;
    margin-top: 12px;
    position: relative;
  }

  .item-box .item-num {
    position: absolute;
    top: 10px;
    left: 10px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    color: var(--black);
    font-size: 0.8rem;
    font-weight: 900;
    padding: 5px 12px;
    border-radius: 8px;
  }

  .item-actions {
    display: flex;
    gap: 8px;
    position: absolute;
    top: 10px;
    right: 10px;
    flex-wrap: wrap;
  }

  /* ============ Images Grid ============ */
  .images-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    margin-top: 12px;
  }

  .img-cell { display: flex; flex-direction: column; gap: 6px; }

  .img-thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 2px solid var(--black-line);
    border-radius: 12px;
    overflow: hidden;
    background: #111;
    transition: border-color 0.2s;
  }

  .img-thumb:hover { border-color: var(--gold); }

  .img-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .img-thumb .img-del {
    position: absolute;
    top: 6px;
    right: 6px;
    background: var(--danger);
    color: #fff;
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 0.85rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(192, 57, 43, 0.5);
  }

  .img-add-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    aspect-ratio: 1 / 1;
    border: 2px dashed var(--gold);
    border-radius: 12px;
    background: rgba(201, 162, 39, 0.04);
    color: var(--gold);
    font-size: 1.8rem;
    cursor: pointer;
    font-weight: 900;
    transition: all 0.2s;
  }

  .img-add-btn:hover {
    background: rgba(201, 162, 39, 0.12);
    transform: scale(1.02);
  }

  .img-add-btn small { font-size: 0.8rem; font-weight: 900; }

  input[type="file"] { display: none; }

  /* ============ Variants ============ */
  .variant-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--black);
    border-radius: 10px;
    border-right: 4px solid var(--gold);
    margin-bottom: 8px;
  }

  .variant-row .var-label {
    flex: 1;
    font-weight: 900;
    font-size: 1rem;
    color: var(--cream);
  }

  .variant-row input {
    width: 120px;
    padding: 8px;
    text-align: center;
  }

  .variant-row .var-del {
    background: var(--danger);
    color: #fff;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 0.9rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* ============ Quantity Presets ============ */
  .presets-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  .preset-input {
    width: 90px;
    padding: 10px;
    text-align: center;
    font-weight: 900;
  }

  .preset-chip-editable {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--black);
    border: 2px solid var(--gold);
    border-radius: 999px;
    padding: 4px 6px 4px 12px;
  }

  .preset-chip-editable input {
    width: 70px;
    border: none;
    background: transparent;
    text-align: center;
    padding: 4px;
    font-weight: 900;
    color: var(--gold);
    font-size: 0.95rem;
  }

  .preset-chip-editable input:focus { outline: none; }

  .preset-chip-editable .chip-del {
    background: var(--danger);
    color: #fff;
    border: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    font-size: 0.7rem;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ============ Branches ============ */
  .branch-edit-box {
    background: var(--black-card);
    border: 2px solid var(--black-line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    position: relative;
    border-right: 4px solid var(--gold);
  }

  .branch-edit-box .branch-num {
    position: absolute;
    top: 10px;
    left: 10px;
    background: var(--gold);
    color: var(--black);
    font-size: 0.75rem;
    font-weight: 900;
    padding: 4px 10px;
    border-radius: 6px;
  }

  .branch-edit-box .branch-actions {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 6px;
  }

  /* ============ Visibility Toggle ============ */
  .vis-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--black-card);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 900;
    cursor: pointer;
    border: 2px solid var(--black-line);
    user-select: none;
    transition: all 0.2s;
  }

  .vis-toggle.on {
    background: rgba(39, 174, 96, 0.15);
    border-color: var(--success);
    color: var(--success);
  }

  .vis-toggle.off {
    background: rgba(192, 57, 43, 0.15);
    border-color: var(--danger);
    color: var(--danger);
  }

  /* ============ Status Toast ============ */
  #statusMsg {
    position: fixed;
    bottom: 20px;
    right: 20px;
    left: 20px;
    max-width: 440px;
    margin: 0 auto;
    background: var(--black-soft);
    border: 3px solid var(--gold);
    border-radius: 14px;
    padding: 16px 22px;
    text-align: center;
    font-weight: 900;
    font-size: 1rem;
    display: none;
    z-index: 100;
    box-shadow: 0 15px 40px var(--shadow-strong);
  }

  #statusMsg.show { display: block; }
  #statusMsg.ok { border-color: var(--success); color: var(--success); }
  #statusMsg.err { border-color: var(--danger); color: var(--danger); }
  #statusMsg.loading { border-color: var(--gold); color: var(--gold); }

  /* ============ Loading Overlay ============ */
  #loadingOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    backdrop-filter: blur(6px);
  }

  #loadingOverlay.show { display: flex; }

  .loader {
    background: var(--black-soft);
    padding: 30px 40px;
    border-radius: 18px;
    text-align: center;
    border: 3px solid var(--gold);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    max-width: 340px;
  }

  .loader .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid var(--black-line);
    border-top-color: var(--gold);
    border-radius: 50%;
    margin: 0 auto 18px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader p {
    font-weight: 900;
    color: var(--gold);
    font-size: 1rem;
    line-height: 1.5;
  }

  /* ============ Save Bar ============ */
  .save-bar {
    position: sticky;
    bottom: 16px;
    background: var(--black-soft);
    border: 3px solid var(--gold);
    border-radius: 18px;
    padding: 14px;
    margin-top: 20px;
    box-shadow: 0 -8px 30px var(--shadow-strong);
    z-index: 40;
  }

  .save-bar button {
    width: 100%;
    padding: 18px;
    font-size: 1.1rem;
  }

  /* ============ Quantity Type Selector ============ */
  .qty-type-selector {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  .qty-type-btn {
    flex: 1;
    padding: 14px;
    border: 2px solid var(--black-line);
    border-radius: 12px;
    background: var(--black);
    color: var(--cream);
    font-weight: 900;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .qty-type-btn:hover { border-color: var(--gold); }

  .qty-type-btn.selected {
    background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    color: var(--black);
    border-color: var(--gold);
  }

  .qty-type-btn .icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }
  .qty-type-btn .label { font-size: 0.9rem; }

  /* ============ Responsive ============ */
  @media (max-width: 600px) {
    body { padding: 8px; font-size: 15px; }
    .admin-header { padding: 14px; gap: 8px; }
    .admin-header h1 { font-size: 1.4rem; }
    .admin-actions { width: 100%; }
    .admin-actions button { flex: 1; padding: 10px 12px; font-size: 0.85rem; }
    .card { padding: 16px; }
    .item-box { padding: 14px; }
    .variant-row input { width: 90px; }
    .preset-input { width: 70px; }
  }
</style>
</head>
<body>

<!-- ============ Login ============ -->
<div id="loginScreen" class="login-wrap">
  <div class="crown">👑</div>
  <h1>قصر عابدين</h1>
  <p class="subtitle">لوحة تحكم المخبوزات والحلويات</p>

  <div class="pw-wrap" style="margin-bottom:10px;">
    <input type="text" id="ownerInput" placeholder="اسم المستخدم/المنظمة في GitHub" autocomplete="off">
  </div>
  <div class="pw-wrap" style="margin-bottom:10px;">
    <input type="text" id="repoInput" placeholder="اسم الريبو" autocomplete="off">
  </div>
  <div class="pw-wrap" style="margin-bottom:10px;">
    <input type="text" id="folderInput" placeholder="اسم الفولدر داخل الريبو (اختياري)" autocomplete="off">
  </div>

  <div class="pw-wrap">
    <input type="password" id="pwInput" placeholder="GitHub Token" autocomplete="off">
    <button type="button" id="togglePw" class="toggle-pw">👁️</button>
  </div>

  <button class="btn-primary" style="width:100%;" id="loginBtn">🔓 دخول</button>
  <div id="loginErr"></div>
  <p class="login-hint">
    التوكن يُحفظ في المتصفح فقط، ولا يُرسل لأي مكان غير GitHub.
  </p>
</div>

<!-- ============ Loading ============ -->
<div id="loadingOverlay">
  <div class="loader">
    <div class="spinner"></div>
    <p id="loadingText">جاري التحميل...</p>
  </div>
</div>

<!-- ============ Dashboard ============ -->
<div id="dashboard">

  <header class="admin-header">
    <h1>👑 لوحة تحكم قصر عابدين</h1>
    <div class="admin-actions">
      <button class="btn-secondary" id="reloadBtn">↻ تحديث</button>
      <button class="btn-primary" id="saveBtn">💾 حفظ</button>
      <button class="btn-secondary" id="logoutBtn">🔑 خروج</button>
    </div>
  </header>

  <!-- ============ الإعدادات العامة ============ -->
  <div class="card">
    <div class="card-title">
      <span class="title-info">
        <span class="zone-icon">⚙️</span>
        <span>الإعدادات العامة</span>
      </span>
    </div>
    <div id="configFields"></div>
  </div>

  <!-- ============ الفروع ============ -->
  <div class="card">
    <div class="card-title">
      <span class="title-info">
        <span class="zone-icon">🏬</span>
        <span>الفروع</span>
        <span class="type-badge" id="branchesBadge">0 فرع</span>
      </span>
    </div>
    <div id="branchesFields"></div>
  </div>

  <!-- ============ الصور المميزة ============ -->
  <div class="card">
    <div class="card-title">
      <span class="title-info">
        <span class="zone-icon">✨</span>
        <span>الصور المميزة (سلايدر)</span>
      </span>
    </div>
    <div id="featuredFields"></div>
  </div>

  <!-- ============ العروض ============ -->
  <div class="card">
    <div class="card-title">
      <span class="title-info">
        <span class="zone-icon">🔥</span>
        <span>عروض وخصومات</span>
        <span class="type-badge" id="offersBadge">0 عرض</span>
      </span>
    </div>
    <div id="offersFields"></div>
  </div>

  <!-- ============ الأقسام ============ -->
  <div id="zonesWrap"></div>

  <button class="btn-add" id="addZoneBtn">+ إضافة قسم جديد</button>

  <!-- ============ Save Bar ============ -->
  <div class="save-bar">
    <button class="btn-primary" id="saveBtnBottom">💾 حفظ كل التعديلات</button>
  </div>

</div>

<div id="statusMsg"></div>

<script src="admin.js"></script>
</body>
</html>
